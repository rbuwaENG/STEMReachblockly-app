name: Release

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip mock coverage requests
      - run: python -m coverage run ardublocklyserver/tests/run_all.py

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    # macos-latest (Apple Silicon) is used deliberately, not macos-13
    # (Intel), even though electron-prebuilt 1.2.x (this app's ancient
    # Electron pin) has no arm64 build and 404s on it: macos-13's queue can
    # be indefinite now that GitHub is winding down its Intel Mac fleet,
    # and timeout-minutes only bounds run time *after* a runner is
    # assigned, not queue wait - so a stuck queue isn't bounded by it at
    # all. macos-latest actually gets a runner and fails fast and
    # predictably instead. continue-on-error keeps that failure from
    # blocking the release job so Windows/Linux artifacts still publish.
    # Real fix needs the Electron toolchain upgraded past the arm64 gap.
    continue-on-error: ${{ matrix.platform_arg == 'mac' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_arg: windows
          - os: macos-latest
            platform_arg: mac
          - os: ubuntu-latest
            platform_arg: linux
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python packaging dependencies
        run: python -m pip install --upgrade pip -r package/requirements.txt

      - name: Build Blockly compressed JS
        working-directory: blockly
        run: python3 build.py

      - name: Build the Python server executable
        run: python3 package/build_pyinstaller.py ${{ matrix.platform_arg }}

      - name: Build the Electron desktop app
        working-directory: package/electron
        run: |
          npm install
          npm run release

      - name: Package the release zip
        run: python3 package/pack_ardublockly.py ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: stemreach-blockly-${{ matrix.platform_arg }}
          path: releases/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only for repo contents unless a repo/
    # org setting raises the default - explicit write access is required to
    # create a release (softprops/action-gh-release otherwise 403s with
    # "Resource not accessible by integration").
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: releases
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: releases/*.zip
