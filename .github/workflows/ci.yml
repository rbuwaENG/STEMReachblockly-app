name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Windows runners default their console to a legacy codepage, which
      # breaks on the non-ASCII strings covered by the test suite.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip mock coverage requests

      - name: Run unit tests
        run: python -m coverage run ardublocklyserver/tests/run_all.py

      - name: Coverage report
        run: python -m coverage report

  build-web:
    name: Blockly build sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Blockly compressed JS
        working-directory: blockly
        run: python3 build.py
